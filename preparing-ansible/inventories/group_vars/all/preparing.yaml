# https://github.com/konstruktoid/ansible-role-hardening

# Security and monitoring tools to install.
# NOTE: 'telnet' and 'git' intentionally omitted — they appear in packages_blocklist
#       and will be purged by the packages.yml task; installing them here would cause
#       a contradiction and leave them present until the purge task runs.
packages:
  - sudo
  - ntp
  - fail2ban
  - iptables-persistent
  - auditd
  - libpwquality-common
  - cracklib-runtime
  - sysstat
  - tcpdump
  - curl
  - wget
  - vim
  - nano
  - bash-completion
  - htop
  - net-tools
  - dnsutils
  - unzip
  - jq

compilers:
  - as
  - cargo
  - cc
  - cc-[0-9]*
  - clang-[0-9]*
  - gcc
  - gcc-[0-9]*
  - go
  - make
  - rustc

password_max_day: 120
password_min_day: 7

# sshd configuration
sshd_config:
  Port: "{{ ansible_port }}"
  ListenAddress: 0.0.0.0
  PermitRootLogin: without-password
  PasswordAuthentication: "no"
  AllowUsers: root
  AllowGroups: root

# ─────────────────────────────────────────────────────────────────────────────
#  Host iptables firewall — full explicit K8s ruleset
# ─────────────────────────────────────────────────────────────────────────────
# Management VLAN : 172.23.34.0/24
# Cluster VLAN    : 10.10.10.0/24
# Pod CIDR        : 10.233.64.0/18  (Kubespray default kube_pods_subnet)
# Service CIDR    : 10.233.0.0/18   (Kubespray default kube_service_addresses)
#
# network_adapter_access : interfaces trusted for ALL traffic (loopback + CNI
#                          virtual interfaces that Kubespray creates later)
# tcp/udp_port_access    : ports opened to ANY source. Keep minimal.
#                          SSH is already opened automatically by the template.
# trusted_Range          : CIDRs given full trust (all ports). Cluster + mgmt
#                          VLANs and the Pod/Service CIDRs go here.
# ─────────────────────────────────────────────────────────────────────────────
iptables:
  network_adapter_access:
    - lo              # loopback — always required
    # CNI interfaces — created by Kubespray when the CNI is installed.
    # Listing them here means once they exist they are fully trusted.
    - cni0            # generic bridge CNI / Flannel bridge
    - flannel.1       # Flannel VXLAN
    - vxlan.calico    # Calico VXLAN (if Calico VXLAN mode)
    # Note: Calico also creates many cali* veth interfaces (one per pod).
    #       If your iptables template supports wildcards, add 'cali+' too.

  tcp_port_access:
    # ── Public ──
    - 80              # HTTP  (ingress controller)
    - 443             # HTTPS (ingress controller)
    # ── Control plane (only effective on master nodes) ──
    - 6443            # kube-apiserver        (admin / kubectl)
    - 2379            # etcd client
    - 2380            # etcd peer
    - 10257           # kube-controller-manager healthz
    - 10259           # kube-scheduler healthz
    # ── All nodes ──
    - 10250           # kubelet API           (metrics scrape, exec, logs)
    - 10256           # kube-proxy healthz    (LB health checks)
    # ── Workers — NodePort Services ──
    - 30000-32767     # NodePort range (template must support range syntax;
                      # otherwise expand or trust at perimeter instead)

  udp_port_access:
    - 8472            # Flannel / Calico VXLAN
    - 4789            # standard VXLAN port (some CNIs)
    # - 51820         # Calico WireGuard mode (uncomment if used)

  trusted_IP: []      # single admin host with full trust — leave empty

  trusted_Range:
    - 10.10.10.0/24   # cluster VLAN     — intra-cluster node-to-node traffic
    - 172.23.34.0/24  # management VLAN  — SSH / Ansible / kubectl / admin
    - 10.233.64.0/18  # Pod CIDR         (Kubespray default kube_pods_subnet)
    - 10.233.0.0/18   # Service CIDR     (Kubespray default kube_service_addresses)

# fail2ban configuration
fail2ban:
  bantime: 10m
  findtime: 10m
  maxretry: 5

# setion timeout setting (seconds)
timeout_time: 600

# auditd vars
auditd_apply_audit_rules: 'yes'
auditd_action_mail_acct: root
auditd_admin_space_left_action: suspend
auditd_disk_error_action: suspend
auditd_disk_full_action: suspend
auditd_max_log_file: 8
auditd_max_log_file_action: keep_logs
auditd_mode: 1
auditd_num_logs: 5
auditd_space_left: 75
auditd_space_left_action: email
grub_audit_backlog_cmdline: audit_backlog_limit=8192
grub_audit_cmdline: audit=1

# lynis variables
lynis_version: '3.0.7'
lynis_name: 'lynis-{{ lynis_version }}'
lynis_tarball_url: 'https://cisofy.com/files/{{ lynis_name }}.tar.gz'
lynis_tarball_unpackdest: '/opt'
lynis_tarball_unpackdest_dir: '{{ lynis_tarball_unpackdest }}/lynis'
lynis_tarball_dest: '{{ lynis_tarball_unpackdest_dir }}/{{ lynis_name }}.tar.gz'

# module blocklists
block_blacklisted: false
fs_modules_blocklist:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - squashfs
  - udf
  - vfat
misc_modules_blocklist:
  - bluetooth
  - bnep
  - btusb
  - can
  - cpia2
  - firewire-core
  - floppy
  - n_hdlc
  - net-pf-31
  - pcspkr
  - soundcore
  - thunderbolt
  - usb-midi
  - usb-storage
  - uvcvideo
  - v4l2_common
net_modules_blocklist:
  - atm
  - dccp
  - sctp
  - rds
  - tipc

# Package variables
system_upgrade: 'yes'
packages_blocklist:
  - apport*
  - autofs
  - avahi*
  - avahi-*
  - beep
  - git
  - pastebinit
  - popularity-contest
  - prelink
  - rpcbind
  - rsh*
  - rsync
  - talk*
  - telnet*
  - tftp*
  - whoopsie
  - xinetd
  - yp-tools
  - ypbind
packages_debian:
  - acct
  - apparmor-profiles
  - apparmor-utils
  - apt-show-versions
  - audispd-plugins
  - auditd
  - cracklib-runtime
  - debsums
  - gnupg2
  - haveged
  - libpam-apparmor
  - libpam-cap
  - libpam-modules
  - libpam-pwquality
  - libpam-tmpdir
  - lsb-release
  - needrestart
  - openssh-server
  - postfix
  - rkhunter
  - rsyslog
  - sysstat
  - tcpd
  - vlock
  - wamerican
packages_ubuntu:
  - fwupd
  - secureboot-db

# dns variables 
dns: 127.0.0.1 1.1.1.1
fallback_dns: 9.9.9.9 1.0.0.1
dnssec: allow-downgrade
dns_over_tls: opportunistic

# Password variables 
crypto_policy: FIPS
pwquality_config:
  dcredit: -1
  dictcheck: 1
  difok: 8
  enforcing: 1
  lcredit: -1
  maxclassrepeat: 4
  maxrepeat: 3
  minclass: 4
  minlen: 15
  ocredit: -1
  ucredit: -1

# Limit.conf variables
limit_nofile_hard: 1024
limit_nofile_soft: 512
limit_nproc_hard: 1024
limit_nproc_soft: 512

# mount variables
hide_pid: 2
process_group: root
