- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart iptables
  ansible.builtin.systemd:
    name: netfilter-persistent
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart ntp
  ansible.builtin.systemd:
    name: ntp
    state: restarted

# auditd cannot be restarted via systemd normally inside a container/some VMs
# https://github.com/ansible/ansible/issues/22171
- name: restart auditd
  become: 'yes'
  ansible.builtin.command: service auditd restart

- name: generate auditd
  become: 'yes'
  ansible.builtin.command: augenrules --load

- name: reload systemd
  become: 'yes'
  ansible.builtin.systemd:
    daemon_reload: 'yes'

- name: update cracklib debian
  become: 'yes'
  ansible.builtin.command: update-cracklib

# Referenced by packagemgmt.yml after apt upgrade
- name: apt-get clean
  become: 'yes'
  ansible.builtin.apt:
    autoclean: yes

- name: apt-get autoremove
  become: 'yes'
  ansible.builtin.apt:
    autoremove: yes
    purge: yes
