---
# Kubespray / Kubernetes node prerequisites.
# Runs on every host (all nodes in this inventory are K8s nodes).
# Idempotent: safe to re-run.

- name: Kubespray | Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: 0644
    content: |
      # Loaded at boot for Kubernetes / containerd networking
      overlay
      br_netfilter

- name: Kubespray | Load br_netfilter now
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Kubespray | Load overlay now
  community.general.modprobe:
    name: overlay
    state: present

- name: Kubespray | Apply bridge / forwarding sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: yes
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",   value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables",  value: "1" }
    - { key: "net.ipv4.ip_forward",                  value: "1" }

- name: Kubespray | Disable swap at runtime
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb is defined and ansible_swaptotal_mb > 0
  changed_when: true

- name: Kubespray | Remove swap entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
