---
- name: mount /proc
  become: 'yes'
  mount:
    name: /proc
    src: none
    fstype: proc
    opts: rw,nosuid,nodev,noexec,relatime,hidepid={{ hide_pid|int }},gid={{ process_group }}
    state: present

- name: stat /dev/shm
  ansible.builtin.stat:
    path: /dev/shm
  register: dev_shm

- name: mount /dev/shm with noexec
  become: 'yes'
  mount:
    name: /dev/shm
    src: none
    fstype: tmpfs
    opts: rw,nosuid,nodev,noexec
    state: present
  when: dev_shm.stat.exists

- name: create tmp.mount
  become: 'yes'
  ansible.builtin.template:
    src: tmp.mount.j2
    dest: /etc/systemd/system/tmp.mount
    backup: 'yes'
    mode: 0644
    owner: root
    group: root

- name: stat tmp.mount
  ansible.builtin.stat:
    path: /etc/systemd/system/tmp.mount
  register: tmp_mount

- name: unmask tmp.mount
  become: 'yes'
  ansible.builtin.systemd:
    name: tmp.mount
    masked: 'no'
  when: tmp_mount.stat.exists

- name: start tmp.mount
  become: 'yes'
  ansible.builtin.systemd:
    name: tmp.mount
    daemon_reload: 'yes'
    state: started
    enabled: 'yes'
  when: tmp_mount.stat.exists
...
